<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tränings app</title>
    <link rel="stylesheet" href="stylesheet.css" />

    <link rel="icon" href="favicon.ico" />
    <!-- Providing a empty file as the favicon so that the browser does not give a error -->
  </head>
  <body>
    <div
      id="övningar"
      class="övningar"
      style="height: 80vh; width: calc(100vw - 12px)"
    ></div>

    <button onclick="sparaTräningspass()" class="klar-button">
      Spara Träningspass
    </button>
    <div class="navigation-bar">
      <button class="navigation-bar" onclick="hemMenu()">
        <img src="images/home.png" alt="Home" class="navigation-bar" />
      </button>
      <button class="navigation-bar" onclick="övningsMenu()">
        <img src="images/fitness.png" alt="Exercises" class="navigation-bar" />
      </button>
      <label for="uploadButton" class="navigation-bar"
        ><img
          src="images/import.png"
          alt="Import data"
          class="navigation-bar"
        />
        <input
          id="uploadButton"
          type="file"
          onchange="importeraData(event)"
          class="navigation-bar"
        />
      </label>
      <button class="navigation-bar" onclick="exporteraData()">
        <img src="images/export.png" alt="Export data" class="navigation-bar" />
      </button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
