<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tränings app</title>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <iframe
      src="index.html"
      frameborder="0"
      id="main-screen-link"
      width="0px"
      height="0px"
      style="position: fixed"
    ></iframe>

    <div name="Ny övning button" class="ny-button">
      <input
        type="text"
        id="nyÖvningInput"
        placeholder="Ny övning"
        class="ny-button"
      />
      <button
        onclick="nyÖvning(); document.getElementById('nyÖvningInput').value = null;"
        class="ny-button"
      >
        <img src="images\add.svg" alt="Lägg till ny övning" class="ny-button" />
      </button>
    </div>
    <hr />
    <div
      id="övningar"
      class="övningar"
      style="height: calc(100vh - 120px)"
    ></div>
    <div class="navigation-bar">
      <button class="navigation-bar" onclick="hemMenu()">
        <img src="images\home.png" alt="Home" class="navigation-bar" />
      </button>
      <button class="navigation-bar" onclick="övningsMenu()">
        <img src="images\fitness.png" alt="Exercises" class="navigation-bar" />
      </button>
      <label for="uploadButton" class="navigation-bar"
        ><img
          src="images/import.png"
          alt="Import data"
          class="navigation-bar"
        />
        <input
          id="uploadButton"
          type="file"
          onchange="importeraData(event)"
          class="navigation-bar"
        />
      </label>
      <button class="navigation-bar" onclick="exporteraData()">
        <img src="images/export.png" alt="Export data" class="navigation-bar" />
      </button>
    </div>
    <script src="övningar.js"></script>
  </body>
</html>
