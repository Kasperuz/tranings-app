<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tränings app</title>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <iframe
      src="index.html"
      frameborder="0"
      id="main-screen-link"
      width="0px"
      height="0px"
      style="position: fixed"
    ></iframe>
    <div class="heading">
      <button class="heading dropdown" id="menu-button" onclick="sidemenu()">
        <img src="images/meny.svg" alt="meny" class="heading" />
      </button>
      <div id="dropdown-menu" class="dropdown">
        <button onclick="hemMenu()" class="dropdown-button">Hem</button>
        <button onclick="övningsMenu()" class="dropdown-button">
          Övningar
        </button>
        <button
          onclick="exporteraData()"
          class="dropdown-button exportera-button"
        >
          Exportera data
        </button>

        <label for="uploadButton" class="dropdown-button importera-button"
          >Importera data
          <input
            id="uploadButton"
            type="file"
            onchange="importeraData(event)"
            class="importera-button"
          />
        </label>
      </div>
      <h1 class="heading">Tränings app</h1>
    </div>
    <div name="Ny övning button" class="ny-button">
      <input
        type="text"
        id="nyÖvningInput"
        placeholder="Ny övning"
        class="ny-button"
      />
      <button
        onclick="nyÖvning(); document.getElementById('nyÖvningInput').value = null;"
        class="ny-button"
      >
        <img src="images\add.svg" alt="Lägg till ny övning" class="ny-button" />
      </button>
    </div>
    <hr />
    <div
      id="övningar"
      class="övningar"
      style="height: calc(100vh - 120px)"
    ></div>
    <script src="övningar.js"></script>
  </body>
</html>
